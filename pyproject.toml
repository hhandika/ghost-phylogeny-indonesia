[project]
name = "ghostphylo"
version = "0.1.0"
description = "Data pipeline for the Indonesian ghost phylogeny: parse, encode, infer with IQ-TREE, export, and draw."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
ghostphylo = "ghostphylo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghostphylo"]
